name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Check build environment
        run: |
          sw_vers
          xcodebuild -version

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Update app version
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          sed -i '' "s/MARKETING_VERSION = .*/MARKETING_VERSION = ${VERSION};/" FlowWatch.xcodeproj/project.pbxproj
          sed -i '' "s/CURRENT_PROJECT_VERSION = .*/CURRENT_PROJECT_VERSION = ${GITHUB_RUN_NUMBER};/" FlowWatch.xcodeproj/project.pbxproj

      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${MACOS_CERTIFICATE_P12_BASE64:-}" ]]; then
            echo "未配置签名证书，跳过证书导入。"
            exit 0
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 -D > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Build app and package
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ -n "${MACOS_CERTIFICATE_P12_BASE64:-}" ]]; then
            zsh scripts/release_build.sh
          else
            zsh scripts/release_build_unsigned.sh
          fi

      - name: Notarize and staple
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          NOTARYTOOL_KEY_ID: ${{ secrets.NOTARYTOOL_KEY_ID }}
          NOTARYTOOL_ISSUER_ID: ${{ secrets.NOTARYTOOL_ISSUER_ID }}
          NOTARYTOOL_KEY_P8_BASE64: ${{ secrets.NOTARYTOOL_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${MACOS_CERTIFICATE_P12_BASE64:-}" ]]; then
            echo "未配置签名证书，跳过公证。"
            exit 0
          fi
          if [[ -z "${APPLE_ID:-}" && -z "${NOTARYTOOL_KEY_ID:-}" ]]; then
            echo "未配置公证凭据，跳过公证。"
            exit 0
          fi
          if [[ -n "${NOTARYTOOL_KEY_P8_BASE64:-}" ]]; then
            KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
            echo "$NOTARYTOOL_KEY_P8_BASE64" | base64 -D > "$KEY_PATH"
            export NOTARYTOOL_KEY_FILE="$KEY_PATH"
          fi
          zsh scripts/notarize.sh dist/FlowWatch.dmg

      - name: Validate Sparkle private key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${SPARKLE_PRIVATE_KEY:-}" ]]; then
            echo "SPARKLE_PRIVATE_KEY is required for signed in-app updates."
            exit 1
          fi

      - name: Fetch Sparkle tools
        env:
          SPARKLE_VERSION: 2.9.6
        run: |
          set -euo pipefail
          ARCHIVE_PATH="$RUNNER_TEMP/Sparkle-${SPARKLE_VERSION}.tar.xz"
          TOOLS_DIR="$RUNNER_TEMP/sparkle-tools"
          curl -fL -o "$ARCHIVE_PATH" \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          mkdir -p "$TOOLS_DIR"
          tar -xf "$ARCHIVE_PATH" -C "$TOOLS_DIR"
          GENERATE_APPCAST_PATH="$(find "$TOOLS_DIR" -type f -name generate_appcast | head -n1)"
          if [[ -z "$GENERATE_APPCAST_PATH" || ! -x "$GENERATE_APPCAST_PATH" ]]; then
            echo "Unable to locate Sparkle generate_appcast."
            exit 1
          fi
          echo "SPARKLE_GENERATE_APPCAST=$GENERATE_APPCAST_PATH" >> "$GITHUB_ENV"

      - name: Generate signed Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          INPUT_DIR="$RUNNER_TEMP/flowwatch-sparkle-input"
          KEY_FILE="$RUNNER_TEMP/flowwatch-sparkle-private.key"
          DOWNLOAD_PREFIX="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
          mkdir -p "$INPUT_DIR"
          cp dist/FlowWatch.zip "$INPUT_DIR/FlowWatch.zip"
          printf "%s" "$SPARKLE_PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          APPCAST_ARGUMENTS=(
            --ed-key-file "$KEY_FILE"
            --download-url-prefix "$DOWNLOAD_PREFIX/"
            --full-release-notes-url "$RELEASE_URL"
          )
          TAG_MESSAGE="$(git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)')"
          if printf '%s\n' "$TAG_MESSAGE" | grep -Eiq '^sparkle:critical[[:space:]]*$'; then
            APPCAST_ARGUMENTS+=(--critical-update-version "")
            echo "Generating critical Sparkle update metadata."
          fi
          "$SPARKLE_GENERATE_APPCAST" "${APPCAST_ARGUMENTS[@]}" \
            -o dist/appcast.xml "$INPUT_DIR"
          rm -f "$KEY_FILE"
          grep -q "sparkle:edSignature" dist/appcast.xml

      - name: Verify release asset
        run: |
          set -euo pipefail
          test -s dist/FlowWatch.dmg
          test -s dist/FlowWatch.zip
          test -s dist/appcast.xml
          ls -lh dist/FlowWatch.dmg dist/FlowWatch.zip dist/appcast.xml

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: FlowWatch-release
          path: |
            dist/FlowWatch.dmg
            dist/FlowWatch.zip
            dist/appcast.xml
          if-no-files-found: error
          retention-days: 7

  publish:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout release automation
        uses: actions/checkout@v7

      - name: Download release artifact
        uses: actions/download-artifact@v8
        with:
          name: FlowWatch-release
          path: dist

      - name: Verify downloaded release asset
        run: |
          set -euo pipefail
          test -s dist/FlowWatch.dmg
          test -s dist/FlowWatch.zip
          test -s dist/appcast.xml
          ls -lh dist/FlowWatch.dmg dist/FlowWatch.zip dist/appcast.xml

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/FlowWatch.dmg
            dist/FlowWatch.zip
            dist/appcast.xml
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew tap cask
        env:
          HOMEBREW_TAP_REPO: W1tFzQq08pTv/homebrew-flowwatch
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          if [[ -z "${HOMEBREW_TAP_TOKEN:-}" ]]; then
            echo "未配置 HOMEBREW_TAP_TOKEN，跳过 Homebrew tap 更新。"
            exit 0
          fi
          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/FlowWatch.dmg"
          curl -fsSL -L "$RELEASE_URL" -o "$RUNNER_TEMP/FlowWatch.dmg"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${HOMEBREW_TAP_REPO}.git" "$RUNNER_TEMP/homebrew-flowwatch"
          ruby .github/scripts/update_homebrew_cask.rb \
            "$RUNNER_TEMP/FlowWatch.dmg" \
            "$VERSION" \
            "$RUNNER_TEMP/homebrew-flowwatch/Casks/flowwatch.rb"
          cd "$RUNNER_TEMP/homebrew-flowwatch"
          git add Casks/flowwatch.rb
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" commit -m "flowwatch ${VERSION}" || exit 0
          git push origin main
